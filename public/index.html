function drill(k){S.cfg=Object.assign({dur:120,only:'all'},S.cfg,{only:k});delete S.cfg.patt;save();start()}
function cfg(k,v){S.cfg=Object.assign({dur:120,only:'all'},S.cfg);S.cfg[k]=v;if(k=='only')delete S.cfg.patt;if(k=='only'&&v=='mix'&&!(S.cfg.mix||[]).length)S.cfg.mix=['mul','div'];save();home()}
function mixT(k){S.cfg=Object.assign({dur:120,only:'mix'},S.cfg);const m=new Set(S.cfg.mix||[]);m.has(k)?m.delete(k):m.add(k);S.cfg.mix=[...m];save();home()}
const save=()=>{S.u=Date.now();try{localStorage[KEY]=JSON.stringify(S)}catch(e){toast('Storage full/blocked: export a backup!')}pushSoon()};
function toast(m){const t=$('#toast');t.textContent=m;t.style.opacity=1;clearTimeout(t.h);t.h=setTimeout(()=>t.style.opacity=0,2200)}
/* ---------- generators ---------- */
const ri=(a,b,R)=>a+Math.floor(R()*(b-a+1)),gcd=(a,b)=>b?gcd(b,a%b):a;
function gen(k,d,R){d=clamp(d,1,12);let q,a,pt='',tip='';
 const cc=(x,y)=>{let c=0,r=0;while(x>0||y>0){const t=x%10+y%10+r;r=t>=10?1:0;c+=r;x=Math.floor(x/10);y=Math.floor(y/10)}return c};
 const bw=(x,y)=>{let c=0,r=0;while(x>0||y>0){r=x%10-r<y%10?1:0;c+=r;x=Math.floor(x/10);y=Math.floor(y/10)}return c};
 const lab=(n,w)=>n==0?'no '+w:n==1?'1 '+w:'2+ '+w+'s';
 const M=Math.round(10**(.5+.35*d)),A=Math.round(lerp([9,9,12,12,12,20,30,50,75,99,150,300],d)),B=Math.round(lerp([9,12,30,60,100,100,100,99,99,99,99,99],d)),L=(h,f)=>Math.min(h,Math.max(2,Math.round(h*f)));
 if(k=='add'){const x=ri(L(M,.2),M,R),y=ri(L(M,.2),M,R);q=x+' + '+y;a=x+y;pt=lab(Math.min(2,cc(x,y)),'carry').replace('carrys','carries')}
 else if(k=='sub'){const x=ri(Math.max(3,L(M,.35)),M,R),y=ri(Math.min(x-1,L(x,.2)),x-1,R);q=x+' − '+y;a=x-y;pt=lab(Math.min(2,bw(x,y)),'borrow')}
 else if(k=='mul'){let x=ri(L(A,.35),A,R),y=ri(L(B,.35),B,R);const t=d>=3&&R()<.28?Math.floor(R()*4):-1;pt=String(x).length+'×'+String(y).length+' digits';
  if(t==0){x=11;y=d<6?ri(12,99,R):ri(100,Math.min(999,Math.round(100+(d-5)*130)),R);pt='×11 trick';tip='×11: split the digits and put their sum between (36×11 → 3_9_6 = 396)'}
  else if(t==1){x=25;y=ri(Math.round(2+d*1.5),Math.round(30+d*15),R);pt='×25 trick';tip='×25 = ÷4 then ×100 (e.g. 36×25 → 9 → 900)'}
  else if(t==2&&d>=6){x=ri(88,112,R);y=ri(88,112,R);pt='near-100 trick';tip='near 100: 100×(100+a+b) + a×b, with a,b signed distances from 100'}
  else if(t==3){x=ri(L(A,.35),A,R);y=R()<.5?99:101;pt='×99/×101 trick';tip='×99 = ×100 − x; ×101 = ×100 + x'}

 else if(k=='div'){const x=ri(L(A,.35),A,R),y=ri(L(B,.35),B,R);q=x*y+' ÷ '+x;a=y;pt='quotient '+String(y).length+'-digit'}
 else if(k=='sq'){const mx=Math.round(lerp([12,15,20,25,30,40,50,75,99,125,150,200],d));let n=ri(Math.max(3,L(mx,.35)),mx,R);const t=R()<.3?Math.floor(R()*3):-1;pt='general';
  if(t==0&&mx>=35){n=ri(Math.max(1,Math.round(Math.floor((mx-5)/10)*.35)),Math.floor((mx-5)/10),R)*10+5;pt='ends in 5 trick';tip='n5²: n×(n+1), then append 25 (35² → 3×4=12 → 1225)'}
  else if(t==1&&mx>=55){n=ri(40,60,R);pt='near-50 trick';tip='(50±k)² = 2500 ± 100k + k²'}
  else if(t==2&&mx>=95){n=ri(91,109,R);pt='near-100 trick';tip='(100±k)² = 10000 ± 200k + k²'}
  q=n+'²';a=n*n}
 else if(k=='pct'){const P=d<3?[10,50,25,20]:d<5?[10,50,25,20,5,75,40,30]:d<7?[15,12,35,60,45,8,90,5]:[17,13,28,37,6,65,125,35,15,45];
  const p=P[Math.floor(R()*P.length)],st=100/gcd(p,100),U=Math.max(1,Math.floor(10**(2+.12*d)/st)),n=st*ri(Math.max(1,Math.round(U*.3)),U,R);q=p+'% of '+n;a=n*p/100;pt=[10,50,25,20,5,75].includes(p)?'friendly %':'awkward %'}
 else{const s1=Math.round(lerp([9,12,20,30,50,80,99,150,250,400,600,999],d)),s2=Math.round(lerp([5,6,8,9,12,12,15,20,25,30,40,50],d)),f=Math.floor(R()*4);pt=['a + b × c','(a + b) × c','a × b − c','(a − b) × c'][f];
  const x=ri(Math.max(3,L(s1,.3)),s1,R),y=ri(L(s2,.4),s2,R),z=ri(L(s2,.4),s2,R),h1=Math.max(3,s1>>1),u=ri(L(h1,.3),h1,R),v=ri(L(h1,.3),h1,R);
  if(f==0){q=x+' + '+y+' × '+z;a=x+y*z}else if(f==1){q='('+u+' + '+v+') × '+z;a=(u+v)*z}
  else if(f==2){const c=ri(1,Math.min(s1,y*z-1),R);q=y+' × '+z+' − '+c;a=y*z-c}else{const r=ri(1,Math.max(1,Math.round(x*.7)),R);q='('+x+' − '+r+') × '+y;a=(x-r)*y}}

/* ---------- adaptive engine ---------- */
const pp=y=>String(y).split('').map((c,i,A)=>+c*10**(A.length-1-i)).filter(Boolean),sg=v=>v<0?'−':'+';
function how(p){const n=(p.q.match(/\d+/g)||[]).map(Number),a=p.a;let m,t;
 if(p.sk=='add'){t=n[0];return n[0]+pp(n[1]).map(v=>' + '+v+' → '+(t+=v)).join('')}
 if(p.sk=='sub'){t=n[0];return n[0]+pp(n[1]).map(v=>' − '+v+' → '+(t-=v)).join('')}
 if(p.sk=='mul'){const x=Math.max(n[0],n[1]),y=Math.min(n[0],n[1]),P=pp(y);return P.length<2?x+' × '+y+' = '+a:P.map(v=>x+'×'+v).join(' + ')+' = '+P.map(v=>x*v).join(' + ')+' = '+a}
 if(p.sk=='div')return n[1]+' × '+a+' = '+n[0]+', so '+n[0]+' ÷ '+n[1]+' = '+a;
 if(p.sk=='sq'){const c=Math.round(n[0]/10)*10,e=n[0]-c;return e&&c?n[0]+'² = ('+c+sg(e)+Math.abs(e)+')² = '+c*c+' '+sg(2*c*e)+' '+Math.abs(2*c*e)+' + '+e*e+' = '+a:n[0]+'² = '+a}
 if(p.sk=='pct')return n[0]%10==0?'10% of '+n[1]+' = '+n[1]/10+', × '+n[0]/10+' = '+a:'1% of '+n[1]+' = '+n[1]/100+', × '+n[0]+' = '+a;
 if(m=p.q.match(/^\((\d+) ([+−]) (\d+)\) × (\d+)$/)){const i=m[2]=='+'?+m[1]+ +m[3]:m[1]-m[3];return '('+m[1]+' '+m[2]+' '+m[3]+') = '+i+', then × '+m[4]+' = '+a}
 if(m=p.q.match(/^(\d+) \+ (\d+) × (\d+)$/))return m[2]+' × '+m[3]+' = '+m[2]*m[3]+' first, then + '+m[1]+' = '+a;
 if(m=p.q.match(/^(\d+) × (\d+) − (\d+)$/))return m[1]+' × '+m[2]+' = '+m[1]*m[2]+', then − '+m[3]+' = '+a;
 return ''}

 <div class="g g2"><div><h2>Accuracy % (last 40 sessions)</h2><div class=card>${spark(L.map(s=>100*s.ok/Math.max(1,s.n)),'#ff9f5a')}</div></div>
 <div><h2>Answers per day (last 14)</h2><div class=card>${(()=>{const D=[...Array(14)].map((_,i)=>ymd(Date.now()-(13-i)*864e5));return bars(D.map(d=>S.sessions.filter(s=>ymd(s.t)==d).reduce((a,s)=>a+s.n,0)),'#6ea8ff',D)})()}</div></div></div>
 <h2>Last 12 weeks</h2><div class=hm>${cells.join('')}</div>
 <h2>Milestones</h2>${MS.map(m=>`<span class="ch ${S.ms.includes(m[0])?'on':''}">${S.ms.includes(m[0])?'🏆':'🔒'} ${m[1]}</span>`).join('')}`}
/* ---------- io + input ---------- */
function help(){const h=$('#help');h.innerHTML=`<div><b>How it works</b><br>Each skill has a rating (×100). Every answer scores speed + accuracy against a target time; ratings drift to where you're ~72% “perfect”.<br>Sessions open with a 3-2-1 countdown (<kbd>Enter</kbd> skips it, <kbd>C</kbd> on home turns it off). <kbd>H</kbd> shows the worked method for any question (hinted answers earn half points and don't move your rating); every miss also shows its worked solution. <kbd>Y</kbd> plays today's Daily challenge (60s, same questions for everyone, ratings untouched), <kbd>G</kbd> changes the daily goal, <kbd>D</kbd> cycles difficulty. Fresh questions avoid anything from your last ~240 answers, even across sessions (a+b and b+a count as the same). Missed items return on purpose in 4 questions, then after 10 min and 1 day (later ones use fresh numbers of the same type).<br>⚡ bonus = harder, ×2 points. Zetamac est. = 120s ÷ your avg time × accuracy.<br><br><kbd>Enter</kbd> train/skip · <kbd>Esc</kbd> pause/home · <kbd>P</kbd> progress · <kbd>C</kbd> copy result · <kbd>X</kbd>/<kbd>I</kbd> export/import · <kbd>M</kbd> sound · <kbd>E</kbd> CSV of your sessions · <kbd>L</kbd> light/dark · <kbd>A</kbd> accent colour · <kbd>F</kbd> question font · <kbd>Z</kbd> focus layout · <kbd>K</kbd> on-screen keypad · <kbd>B</kbd> auto-pause on window switch · <kbd>N</kbd> notebook of misses · <kbd>R</kbd> review missed · <kbd>W</kbd> (end screen) drill weakest skill · “Drill” buttons in Progress practise one slow pattern<br>On the home screen: <kbd>1</kbd>–<kbd>6</kbd> sets length (30s to 10 min, or untimed practice), <kbd>←</kbd>/<kbd>→</kbd> picks a skill. Each setting keeps its own best and ghost.<br><span class=mu>Press any key or tap to close</span></div>`;h.onclick=()=>{h.style.display='none'};h.style.display='grid'}
function copy(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).catch(()=>{const x=document.createElement('textarea');x.value=t;document.body.append(x);x.select();document.execCommand('copy');x.remove()}).then(()=>toast('Copied!'))}
function csv(){if(!S.sessions.length)return toast('No sessions yet');const r=['date,mode,seconds,answers,correct,accuracy_pct,points,avg_seconds'].concat(S.sessions.map(x=>[new Date(x.t).toISOString(),x.m,x.dur,x.n,x.ok,Math.round(100*x.ok/Math.max(1,x.n)),x.pts,x.tm].join(',')));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([r.join('\n')],{type:'text/csv'}));a.download='mentalmath-sessions-'+ymd()+'.csv';a.click();toast('CSV downloaded')}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='mentalmath-backup-'+ymd()+'.json';a.click();S.lastExport=Date.now();save();toast('Backup downloaded')}
$('#imp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.sk||!Array.isArray(o.sessions))throw 0;
 if(!confirm('Replace current data ('+S.sessions.length+' sessions) with backup ('+o.sessions.length+' sessions)?'))return;
 const b=fresh();S={...b,...o,sk:{...b.sk,...o.sk}};S.pat=S.pat||{};save();toast('Imported');scr=='prog'?prog():home()}catch(x){toast('Not a valid backup file')}e.target.value=''};r.readAsText(f)};
function act(k){
 if(scr=='play'){if(sess.cd){if(k=='Escape'){clearInterval(sess.iv);sess=null;home()}else if(k=='Enter'||k==' ')sess.go();return}if(sess.paused){if(k=='Enter')resume();else if(k=='Escape')finish();return}if(/^\d$/.test(k)){if(sess.wrong){sess.wrong=0;buf=''}buf+=k;try{navigator.vibrate&&matchMedia('(pointer:coarse)').matches&&navigator.vibrate(5)}catch(e){}check()}else if(k=='Backspace'){if(sess.wrong){sess.wrong=0;buf=''}else buf=buf.slice(0,-1);$('#bf').textContent=buf+'▏'}
  else if(k=='Enter'||k==' '){answer(false);next()}else if(k=='Escape')pause();else if(k=='h'||k=='H'){sess.cur.hinted=1;$('#ms').innerHTML='<span class=mu>'+(sess.cur.tip?'💡 '+sess.cur.tip+'<br>':'')+'🧠 '+how(sess.cur)+' · hint used: half points, no rating change</span>'}return}
 k=k.toLowerCase();
 if($('#help').style.display=='grid'){$('#help').style.display='none';return}
 if(scr=='home'){if(k=='y')return start('daily');if(k=='n'&&Object.keys(S.weak).length)return nb();if(k=='d'){const o=[-1.5,0,1.5,3],i=(o.indexOf((S.cfg&&S.cfg.off)||0)+1)%4;return cfg('off',o[i])}if(k=='g'){S.goal=({1:2,2:3,3:5,5:1})[S.goal||2];save();return home()}if(k=='c'){S.noCd=!S.noCd;save();home();return toast('Countdown '+(S.noCd?'off':'on'))}if(k>='1'&&k<='6')return cfg('dur',[30,60,120,300,600,0][k-1]);if(k=='arrowleft'||k=='arrowright'){const o=['all',...IDS],c=Object.assign({only:'all'},S.cfg).only,i=(o.indexOf(c)+(k=='arrowright'?1:o.length-1))%o.length;return cfg('only',o[i])}}
 if(k=='?')return help();
 if(k=='k'){S.pad=!(S.pad!=null?S.pad:matchMedia('(pointer:coarse)').matches);save();applyTheme();return toast('On-screen keypad '+(S.pad?'on':'off'))}if(k=='b'){S.noBlur=!S.noBlur;save();return toast('Auto-pause when you switch windows: '+(S.noBlur?'off':'on'))}if(k=='z'){S.zen=!S.zen;save();applyTheme();return toast('Focus layout '+(S.zen?'on: no side panel or race bar':'off'))}if(k=='m'){S.mute=!S.mute;save();return toast('Sound '+(S.mute?'off':'on'))}
 if(k=='f'){S.font=({sans:'mono',mono:'round',round:'sans'})[S.font||'sans'];save();applyTheme();return toast('Question font: '+S.font)}
 if(k=='a'){const o=Object.keys(ACC),i=(o.indexOf(S.acc||'blue')+1)%o.length;S.acc=o[i];save();applyTheme();return toast('Accent: '+S.acc)}
 if(k=='l'){S.theme=document.documentElement.dataset.theme=='light'?'dark':'light';save();return applyTheme()}
 if((scr=='home'||scr=='end'||scr=='nb')&&k=='r'&&Object.keys(S.weak).length)return start('review');
 if(k=='e')return csv();
 if(k=='x')return exp();if(k=='i')return $('#imp').click();
 if(scr=='end'){if(Date.now()-window.endAt<800)return;if(k=='c')return copy(window.lastLine);if(k=='w')return drill(weakest());if(k=='enter')return start();}
 if(scr=='prog'||scr=='nb'){if(k=='escape')home();return}
 if(k=='enter'||k=='t')start();else if(k=='p')prog();else if(k=='escape')home()}
addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;{const a=document.activeElement;if(scr!='play'&&a&&/^(BUTTON|SUMMARY|INPUT)$/.test(a.tagName)&&(e.key==' '||e.key=='Enter'||e.key=='Tab'))return}if(['Enter',' ','Backspace','Escape','Tab','ArrowLeft','ArrowRight'].includes(e.key)||/^\d$/.test(e.key)||e.key.length==1){if(['Enter',' ','Backspace'].includes(e.key)||scr=='play')e.preventDefault();if(scr=='play')document.activeElement&&document.activeElement.blur();act(e.key)}});
['beforeunload','pagehide'].forEach(ev=>addEventListener(ev,()=>{if(sess&&sess.n)finish()}));
/* ---------- cloud sync (Netlify Function + Blobs) ---------- */
const SYK='mmTrainer.sync',syncKey=()=>{try{return localStorage[SYK]||''}catch(e){return''}};
let synced=false,syncMsg='',pushT,busy=0,ip;
const syncLine=()=>!syncKey()?'☁ Sync off · tap to set up':syncMsg||'☁ Syncing…',showSync=()=>{const e=$('#sy');if(e)e.textContent=syncLine()};
function mergeS(a,b){const nw=(a.u||0)>=(b.u||0)?a:b,od=nw===a?b:a,m={...od,...nw},seen=new Set(),U=(x,y)=>[...new Set([...Object.keys(x||{}),...Object.keys(y||{})])];
 m.sessions=[...a.sessions,...b.sessions].filter(x=>!seen.has(x.t)&&seen.add(x.t)).sort((x,y)=>x.t-y.t);
 m.ms=[...new Set([...(a.ms||[]),...(b.ms||[])])];
 m.best={};U(a.best,b.best).forEach(k=>{const x=(a.best||{})[k],y=(b.best||{})[k];m.best[k]=!y||(x&&x.pts>=y.pts)?x:y});
 m.daily={};U(a.daily,b.daily).forEach(k=>m.daily[k]=Math.max((a.daily||{})[k]||0,(b.daily||{})[k]||0));
 m.lastExport=Math.max(a.lastExport||0,b.lastExport||0);m.u=Math.max(a.u||0,b.u||0);['pad','theme','acc','font','zen','mute','noBlur','noCd'].forEach(k=>m[k]=a[k]);return m}
async function api(m,b){const r=await fetch('/api/sync',{method:m,headers:{'x-sync-key':syncKey(),'content-type':'application/json'},body:b?JSON.stringify(b):undefined});if(r.status==401)throw new Error('key');if(!r.ok)throw new Error('http'+r.status);return r.json()}
const stamp=()=>'☁ Synced '+new Date().toTimeString().slice(0,5);
async function push(){if(!syncKey()||!synced||sess)return;try{await api('PUT',S);syncMsg=stamp()}catch(e){syncMsg=e.message=='key'?'☁ Wrong sync key':'☁ Offline · will retry'}showSync()}
function pushSoon(){if(!syncKey()||!synced)return;clearTimeout(pushT);pushT=setTimeout(push,1200)}
async function pull(){if(!syncKey()||sess||busy)return;busy=1;try{const r=(await api('GET')).data;let ch=0;
 if(r&&r.sk&&Array.isArray(r.sessions)){ch=(r.u||0)>(S.u||0);const n=S.sessions.length;S=mergeS(S,r);S.pat=S.pat||{};try{localStorage[KEY]=JSON.stringify(S)}catch(e){}synced=true;
  if(ch||S.sessions.length!=n){applyTheme();if(scr=='home')home();else if(scr=='prog')prog()}if(S.sessions.length!=r.sessions.length||S.u!=r.u)await push()}
 else{synced=true;await push()}syncMsg=stamp()}catch(e){syncMsg=e.message=='key'?'☁ Wrong sync key':'☁ Offline · will retry'}busy=0;showSync()}
function syncTap(){if(!syncKey())return syncSetup();toast('Syncing…');(synced?(clearTimeout(pushT),push()):Promise.resolve()).then(pull).then(()=>toast(syncMsg||'Done'))}
function syncSetup(){const k=prompt('Sync key (the SYNC_KEY from Netlify, identical on every device). Leave empty to turn sync off.',syncKey());if(k===null)return;
 try{k.trim()?localStorage[SYK]=k.trim():localStorage.removeItem(SYK)}catch(e){}synced=false;syncMsg='';if(scr=='home')home();k.trim()?pull():toast('Sync off')}
addEventListener('focus',pull);addEventListener('online',pull);addEventListener('beforeinstallprompt',e=>{e.preventDefault();ip=e});document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});setInterval(pull,3e5);pull();if('serviceWorker'in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
try{navigator.storage&&navigator.storage.persist()}catch(e){}
home();
</script></body></html>
